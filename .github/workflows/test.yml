name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:ruby

  # An app's view: a project that takes the toolkit from GitHub at this exact
  # commit, as apps pin it, installs it without lifecycle scripts, and runs
  # every command from node_modules/.bin. The gem comes the same way.
  consumer:
    name: Clean consumer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: toolkit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - name: Install the toolkit from GitHub at this commit
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir consumer && cd consumer
          jq -n --arg dep "github:$GITHUB_REPOSITORY#$SHA" \
            '{name: "consumer", private: true, devDependencies: {"@ieasybooks/release": $dep}}' > package.json
          bun install --ignore-scripts
          grep -F "$SHA" bun.lock > /dev/null || { echo "::error::bun.lock doesn't pin $SHA."; exit 1; }
          test -x node_modules/.bin/ieasybooks-release
      - name: Run every command from node_modules/.bin
        working-directory: ${{ runner.temp }}/consumer
        env:
          TOOLKIT: ${{ github.workspace }}/toolkit
          # The commit checks reach GitHub through gh.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cli=./node_modules/.bin/ieasybooks-release
          bun "$TOOLKIT/test/make-fixture.ts" apps/app 0.1.3

          $cli release-info --app apps/app | jq -e '. == {"version":"0.1.3","iosBuildNumber":"1003","androidVersionCode":1003}'
          $cli store check --app apps/app --tag v0.1.3
          $cli store fastlane-metadata --app apps/app "$RUNNER_TEMP/metadata"
          test -s "$RUNNER_TEMP/metadata/app-store/metadata/en-US/name.txt"
          test -s "$RUNNER_TEMP/metadata/google-play/metadata/ar/changelogs/1003.txt"
          if $cli store check --app apps/app --tag v0.1.4; then echo "::error::A mismatched tag passed."; exit 1; fi

          set +e
          APPGALLERY_CONNECT_SERVICE_ACCOUNT='' $cli appgallery publish --app apps/app x.apk
          status=$?
          set -e
          test "$status" = 2

          git init -q -b main repo
          echo '{"packages":{"apps/app":{}}}' > repo/release-please-config.json
          git -C repo -c user.name=t -c user.email=t@t add -A
          git -C repo -c user.name=t -c user.email=t@t commit -q -m "chore: start"
          mkdir -p repo/apps/app && echo x > repo/apps/app/a.ts
          git -C repo -c user.name=t -c user.email=t@t add -A
          git -C repo -c user.name=t -c user.email=t@t commit -q -m "fix: a"
          (cd repo && TITLE="fix: a" "../$cli" routing HEAD~1 HEAD)

          if $cli verify-commit no-such-tag "$SHA"; then echo "::error::A missing tag passed."; exit 1; fi
          $cli not-superseded v999.0.0

          node -e 'const { buildNumber } = require("@ieasybooks/release/build-number"); if (buildNumber("1.2.3") !== 1002003) process.exit(1)'
          echo "Every command ran from node_modules/.bin."
      - name: Load the gem from GitHub at this commit
        working-directory: ${{ runner.temp }}/consumer
        run: |
          set -euo pipefail
          cat > Gemfile <<EOF
          source "https://rubygems.org"
          gem "ieasybooks-release", git: "https://github.com/$GITHUB_REPOSITORY.git", ref: "$SHA", glob: "ruby/*.gemspec"
          EOF
          bundle install --quiet
          grep -F "$SHA" Gemfile.lock > /dev/null || { echo "::error::Gemfile.lock doesn't pin $SHA."; exit 1; }
          bundle exec ruby -e 'require "ieasybooks/release"; abort unless Ieasybooks::Release::ReviewReplacement && Ieasybooks::Release::AppStoreReviews; puts "The gem loads."'
